<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HackerRank test-case fixture</title>
  </head>
  <body>
    <main class="challenge-testcases">
      <button class="save-challenge btn btn-green" type="button">Save Changes</button>

      <div class="table-wrap">
        <header class="row">
          <div class="order">Order</div>
          <div class="strength">Strength</div>
          <div class="controls">Select</div>
        </header>
        <div class="table-body">
          <div id="test-case-fixture-001" class="row row-alt" data-index="0" data-id="fixture-001">
            <div class="order">0</div>
            <div class="strength">
              <input class="case-score-text" data-id="fixture-001" type="text" value="0">
            </div>
            <span hidden="true" data-id="fixture-001" class="tick-save-error error">Error: save failed!</span>
            <div class="controls">
              <input type="checkbox" class="testcase-selector" data-score="0" data-id="fixture-001">
            </div>
          </div>

          <div id="test-case-fixture-002" class="row" data-index="1" data-id="fixture-002">
            <div class="order">1</div>
            <div class="strength">
              <input class="case-score-text" data-id="fixture-002" type="text" value="10">
            </div>
            <span hidden="true" data-id="fixture-002" class="tick-save-error error">Error: save failed!</span>
            <div class="controls">
              <input type="checkbox" class="testcase-selector" data-score="10" data-id="fixture-002">
            </div>
          </div>

          <div id="test-case-fixture-003" class="row row-alt" data-index="2" data-id="fixture-003">
            <div class="order">2</div>
            <div class="strength">
              <input class="case-score-text" data-id="fixture-003" type="text" value="5.5">
            </div>
            <span hidden="true" data-id="fixture-003" class="tick-save-error error">Error: save failed!</span>
            <div class="controls">
              <input type="checkbox" class="testcase-selector" data-score="5.5" data-id="fixture-003">
            </div>
          </div>

          <div id="test-case-fixture-004" class="row" data-index="3" data-id="fixture-004">
            <div class="order">3</div>
            <div class="strength">
              <input class="case-score-text" data-id="fixture-004" type="text" value="1">
            </div>
            <span hidden="true" data-id="fixture-004" class="tick-save-error error">Error: save failed!</span>
            <div class="controls">
              <input type="checkbox" class="testcase-selector" data-score="1" data-id="fixture-004">
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
